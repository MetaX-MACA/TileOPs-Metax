name: Nightly

permissions: read-all

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# All nightly jobs run on a containerized self-hosted runner (label: nightly).
# The runner container is provisioned by the host with GPU access, persistent
# cache mounts, and the runtime environment variables below.
# ---------------------------------------------------------------------------

env:
  TILELANG_CACHE_DIR: /data7/shared/ci-cache/tilelang
  TILELANG_TMP_DIR: /data7/shared/ci-cache/tilelang/tmp
  TRITON_CACHE_DIR: /data7/shared/ci-cache/triton
  PIP_CACHE_DIR: /data7/shared/ci-cache/pip
  WHEEL_DIR: /data7/shared/ci-cache/wheels
  MAX_JOBS: "64"

jobs:
  # =========================================================================
  # Phase 1 — Warm the kernel compilation cache
  # =========================================================================
  cache-warmup:
    if: ${{ github.repository == 'MetaX-MACA/TileOPs-Metax' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') }}
    timeout-minutes: 60
    runs-on: [tileops-metax-runner, self-hosted, tile-ops, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git

      - name: Configure persistent compile caches
        run: |
          set -euo pipefail

          # Add conda to PATH
          export PATH="/opt/conda/bin:${PATH}"

          # Set MACA environment variables
          export USE_MACA=ON

          TILELANG_CACHE_DIR="${HOME}/.tilelang/cache"
          TILELANG_TMP_DIR="${TILELANG_CACHE_DIR}/tmp"
          TRITON_CACHE_DIR="${HOME}/.triton/cache"
          PIP_CACHE_DIR="${HOME}/.cache/pip"
          WHEEL_DIR="${HOME}/.wheel-cache"

          mkdir -p "${TILELANG_CACHE_DIR}" "${TILELANG_TMP_DIR}" "${TRITON_CACHE_DIR}" "${PIP_CACHE_DIR}" "${WHEEL_DIR}"

          {
            echo "PATH=${PATH}"
            echo "USE_MACA=ON"
            echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
            echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
            echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
            echo "PIP_CACHE_DIR=${PIP_CACHE_DIR}"
            echo "WHEEL_DIR=${WHEEL_DIR}"
          } >> "$GITHUB_ENV"

          echo "Configured compile caches:"
          echo "  TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
          echo "  TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
          echo "  TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
          echo "  PIP_CACHE_DIR=${PIP_CACHE_DIR}"
          echo "  WHEEL_DIR=${WHEEL_DIR}"
        shell: bash

      - name: Resolve persistent venv
        run: |
          set -euo pipefail

          VENV_PREFIX="tileops_benchmarks_venv"
          DEP_HASH="$(python3 scripts/dep_hash.py)"
          HASH_INPUT="$(
            {
              echo "python=3.12"
              echo "install=PIP_NO_BUILD_ISOLATION=1 pip install -e '.[dev]'"
              echo "${DEP_HASH}"
            } | sha256sum | cut -c1-16
          )"
          VENV_DIR="${VENV_PREFIX}_${HASH_INPUT}"
          VENV_PATH="${{ runner.tool_cache }}/${VENV_DIR}"

          echo "Resolved venv path: ${VENV_PATH}"
          echo "VENV_DIR=${VENV_DIR}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"

          if [ -x "${VENV_PATH}/bin/python" ]; then
            echo "Reusing existing venv: ${VENV_PATH}"
            echo "VENV_REUSED=true" >> "$GITHUB_ENV"
          else
            echo "No matching venv found. Will create: ${VENV_PATH}"
            echo "VENV_REUSED=false" >> "$GITHUB_ENV"

            for old_venv in "${{ runner.tool_cache }}/${VENV_PREFIX}"_*; do
              if [ ! -d "${old_venv}" ]; then
                continue
              fi
              if [ "${old_venv}" = "${VENV_PATH}" ]; then
                continue
              fi
              echo "Removing stale venv: ${old_venv}"
              rm -rf "${old_venv}"
            done
          fi
        shell: bash

      - name: Ensure persistent venv and install dependencies
        run: |
          set -euo pipefail
          if [ "${VENV_REUSED}" = "true" ]; then
            echo "Using cached venv at ${VENV_PATH}"
            exit 0
          fi

          echo "Creating fresh venv at ${VENV_PATH}"
          python -m venv "${VENV_PATH}"
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          # Copy pre-installed MACA torch packages from conda to venv
          cp -rf /opt/conda/lib/python3.12/site-packages/* "${VENV_PATH}/lib/python3.12/site-packages/"

          python -m pip install --upgrade pip setuptools wheel --no-user

          # Install test dependencies
          pip install --no-cache-dir \
            einops numpy "tqdm>=4.62.3" "typing_extensions>=4.10.0" \
            cloudpickle ml_dtypes psutil Cython \
            setuptools wheel ninja
          pip install --no-cache-dir \
            "pytest==9.0.2" \
            "pytest-xdist>=3.0" \
            "pyyaml>=6.0"

          FIND_LINKS_FLAG=""
          if [[ -d "${WHEEL_DIR}" ]] && ls "${WHEEL_DIR}"/*.whl >/dev/null 2>&1; then
            FIND_LINKS_FLAG="--find-links ${WHEEL_DIR}"
          fi
          # shellcheck disable=SC2086
          PIP_NO_BUILD_ISOLATION=1 PIP_CACHE_DIR="${PIP_CACHE_DIR}" pip install -e '.[dev]' ${FIND_LINKS_FLAG}

          # Install TileLang (MACA version)
          pip install --no-cache-dir git+https://github.com/tile-ai/tilelang-metax.git@1efc3ba8a7c48bc97047e562223538d2dcb2222d

          pip wheel -e '.[dev]' -w "${WHEEL_DIR}" 2>/dev/null || true
        shell: bash

      - name: Pre-compile all benchmark kernel variants
      - name: Verify nightly runner environment
        run: scripts/ci/verify_nightly_runner.sh
        shell: bash

      - name: Set up run-local venv
        run: scripts/ci/setup_nightly_venv.sh
        shell: bash

      - name: Warm kernel compilation cache
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          PIP_NO_BUILD_ISOLATION=1 pip install -e ".[dev]"

          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:$PYTHONPATH}"
          echo "Starting kernel cache warmup..."
          python scripts/warmup_kernel_cache.py --max-workers 64 -n 16
        shell: bash

      - name: Cleanup run-local venv
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_ROOT:-}" && "${RUNTIME_ROOT}" == "${RUNNER_TEMP}/nightly-"* ]]; then
            rm -rf "${RUNTIME_ROOT}"
          fi
        shell: bash

  # =========================================================================
  # Phase 2 — Benchmark (exclusive GPU access for accurate profiling)
  # =========================================================================
  benchmark:
    if: ${{ always() && github.repository == 'MetaX-MACA/TileOPs-Metax' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') }}
    needs: [cache-warmup]
    timeout-minutes: 120
    runs-on: [tileops-metax-runner, self-hosted, tile-ops, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git

      - name: Configure persistent compile caches
        run: |
          set -euo pipefail

          # Add conda to PATH
          export PATH="/opt/conda/bin:${PATH}"

          # Set MACA environment variables
          export USE_MACA=ON

          TILELANG_CACHE_DIR="${HOME}/.tilelang/cache"
          TILELANG_TMP_DIR="${TILELANG_CACHE_DIR}/tmp"
          TRITON_CACHE_DIR="${HOME}/.triton/cache"
          PIP_CACHE_DIR="${HOME}/.cache/pip"
          WHEEL_DIR="${HOME}/.wheel-cache"

          mkdir -p "${TILELANG_CACHE_DIR}" "${TILELANG_TMP_DIR}" "${TRITON_CACHE_DIR}" "${PIP_CACHE_DIR}" "${WHEEL_DIR}"

          {
            echo "PATH=${PATH}"
            echo "USE_MACA=ON"
            echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
            echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
            echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
            echo "PIP_CACHE_DIR=${PIP_CACHE_DIR}"
            echo "WHEEL_DIR=${WHEEL_DIR}"
          } >> "$GITHUB_ENV"

          echo "Configured compile caches:"
          echo "  TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
          echo "  TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
          echo "  TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
          echo "  PIP_CACHE_DIR=${PIP_CACHE_DIR}"
          echo "  WHEEL_DIR=${WHEEL_DIR}"
        shell: bash

      - name: Validate GPU frequency
        run: |
          set -euo pipefail
          TARGET_CLOCK_MHZ=1830
          RETRIES=5
          SLEEP_SECONDS=2

          if ! command -v mx-smi >/dev/null 2>&1; then
            echo "::error::mx-smi is not available on this runner."
            exit 1
          fi

          echo "Detected GPUs:"
          mx-smi -L

          attempt=1
          while [ "$attempt" -le "$RETRIES" ]; do
            echo "Validation attempt ${attempt}/${RETRIES}"
            mismatch=0
            while IFS=',' read -r gpu_index gpu_name gpu_clock; do
              gpu_index="$(echo "$gpu_index" | xargs)"
              gpu_name="$(echo "$gpu_name" | xargs)"
              gpu_clock="$(echo "$gpu_clock" | xargs)"
              echo "GPU ${gpu_index} (${gpu_name}) clock: ${gpu_clock} MHz"
              if [ "$gpu_clock" != "$TARGET_CLOCK_MHZ" ]; then
                mismatch=1
              fi
            done < <(mx-smi --query-gpu=index,name,clocks.current.graphics --format=csv,noheader,nounits)

            if [ "$mismatch" -eq 0 ]; then
              echo "All GPUs locked at ${TARGET_CLOCK_MHZ} MHz."
              break
            fi

            if [ "$attempt" -eq "$RETRIES" ]; then
              echo "::error::GPU frequency validation failed. Expected ${TARGET_CLOCK_MHZ} MHz on all GPUs."
              exit 1
            fi

            sleep "$SLEEP_SECONDS"
            attempt=$((attempt + 1))
          done
        shell: bash

      - name: Resolve persistent venv
        run: |
          set -euo pipefail

          VENV_PREFIX="tileops_benchmarks_venv"
          DEP_HASH="$(python3 scripts/dep_hash.py)"
          HASH_INPUT="$(
            {
              echo "python=3.12"
              echo "install=PIP_NO_BUILD_ISOLATION=1 pip install -e '.[dev]'"
              echo "${DEP_HASH}"
            } | sha256sum | cut -c1-16
          )"
          VENV_DIR="${VENV_PREFIX}_${HASH_INPUT}"
          VENV_PATH="${{ runner.tool_cache }}/${VENV_DIR}"

          echo "Resolved venv path: ${VENV_PATH}"
          echo "VENV_DIR=${VENV_DIR}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"

          if [ -x "${VENV_PATH}/bin/python" ]; then
            echo "Reusing existing venv: ${VENV_PATH}"
            echo "VENV_REUSED=true" >> "$GITHUB_ENV"
          else
            echo "No matching venv found. Will create: ${VENV_PATH}"
            echo "VENV_REUSED=false" >> "$GITHUB_ENV"

            for old_venv in "${{ runner.tool_cache }}/${VENV_PREFIX}"_*; do
              if [ ! -d "${old_venv}" ]; then
                continue
              fi
              if [ "${old_venv}" = "${VENV_PATH}" ]; then
                continue
              fi
              echo "Removing stale venv: ${old_venv}"
              rm -rf "${old_venv}"
            done
          fi
        shell: bash

      - name: Ensure persistent venv and install dependencies
        run: |
          set -euo pipefail
          if [ "${VENV_REUSED}" = "true" ]; then
            echo "Using cached venv at ${VENV_PATH}"
            exit 0
          fi

          echo "Creating fresh venv at ${VENV_PATH}"
          python -m venv "${VENV_PATH}"
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          # Copy pre-installed MACA torch packages from conda to venv
          cp -rf /opt/conda/lib/python3.12/site-packages/* "${VENV_PATH}/lib/python3.12/site-packages/"

          python -m pip install --upgrade pip setuptools wheel --no-user

          # Install test dependencies
          pip install --no-cache-dir \
            einops numpy "tqdm>=4.62.3" "typing_extensions>=4.10.0" \
            cloudpickle ml_dtypes psutil Cython \
            setuptools wheel ninja
          pip install --no-cache-dir \
            "pytest==9.0.2" \
            "pytest-xdist>=3.0" \
            "pyyaml>=6.0"

          FIND_LINKS_FLAG=""
          if [[ -d "${WHEEL_DIR}" ]] && ls "${WHEEL_DIR}"/*.whl >/dev/null 2>&1; then
            FIND_LINKS_FLAG="--find-links ${WHEEL_DIR}"
          fi
          # shellcheck disable=SC2086
          PIP_NO_BUILD_ISOLATION=1 PIP_CACHE_DIR="${PIP_CACHE_DIR}" pip install -e '.[dev]' ${FIND_LINKS_FLAG}

          # Install TileLang (MACA version)
          pip install --no-cache-dir git+https://github.com/tile-ai/tilelang-metax.git@1efc3ba8a7c48bc97047e562223538d2dcb2222d

          pip wheel -e '.[dev]' -w "${WHEEL_DIR}" 2>/dev/null || true
      - name: Verify nightly runner environment
        run: scripts/ci/verify_nightly_runner.sh
        shell: bash

      - name: Set up run-local venv
        run: scripts/ci/setup_nightly_venv.sh
        shell: bash

      - name: Run benchmark ops
        id: benchmark_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          # Validate GPU frequency
          TARGET_CLOCK_MHZ=1830
          RETRIES=5
          for i in $(seq 1 "${RETRIES}"); do
            gpu_clock=$(mx-smi --query-gpu=clocks.current.graphics --format=csv,noheader,nounits | xargs)
            echo "GPU clock: ${gpu_clock} MHz (attempt ${i}/${RETRIES})"
            if [ "${gpu_clock}" = "${TARGET_CLOCK_MHZ}" ]; then break; fi
            if [ "${i}" -eq "${RETRIES}" ]; then
              echo "::error::GPU frequency validation failed. Expected ${TARGET_CLOCK_MHZ} MHz."
              exit 1
            fi
            sleep 2
          done

          PIP_NO_BUILD_ISOLATION=1 pip install -e ".[dev]"

          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:$PYTHONPATH}"
          echo "Runtime cache env:"
          echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR:-}"
          echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR:-}"
          echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR:-}"

          set -o pipefail
          python -m pytest -q benchmarks/ops --junit-xml=bench_results.xml | tee tileops_benchmarks.log

          if [ -f profile_run.log ]; then
            { echo; echo "===== profile_run.log summary ====="; cat profile_run.log; } >> tileops_benchmarks.log
          else
            echo "::warning::profile_run.log not found; benchmark may have failed partially" >> tileops_benchmarks.log
          fi
        shell: bash

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tileops_benchmark_${{ github.run_id }}
          path: |
            tileops_benchmarks.log
            bench_results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fail benchmark job if pytest failed
        if: ${{ always() && steps.benchmark_tests.outcome == 'failure' }}
        run: exit 1
        shell: bash

      - name: Cleanup run-local venv
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_ROOT:-}" && "${RUNTIME_ROOT}" == "${RUNNER_TEMP}/nightly-"* ]]; then
            rm -rf "${RUNTIME_ROOT}"
          fi
        shell: bash

  # =========================================================================
  # Phase 3 — Op correctness tests (serial after benchmark for GPU exclusivity)
  # =========================================================================
  op_test:
    if: ${{ always() && github.repository == 'MetaX-MACA/TileOPs-Metax' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') }}
    needs: [benchmark]
    timeout-minutes: 180
    runs-on: [tileops-metax-runner, self-hosted, tile-ops, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git

      - name: Configure persistent compile caches
        run: |
          set -euo pipefail

          # Add conda to PATH
          export PATH="/opt/conda/bin:${PATH}"

          # Set MACA environment variables
          export USE_MACA=ON

          TILELANG_CACHE_DIR="${HOME}/.tilelang/cache"
          TILELANG_TMP_DIR="${TILELANG_CACHE_DIR}/tmp"
          TRITON_CACHE_DIR="${HOME}/.triton/cache"
          PIP_CACHE_DIR="${HOME}/.cache/pip"
          WHEEL_DIR="${HOME}/.wheel-cache"

          mkdir -p "${TILELANG_CACHE_DIR}" "${TILELANG_TMP_DIR}" "${TRITON_CACHE_DIR}" "${PIP_CACHE_DIR}" "${WHEEL_DIR}"

          {
            echo "PATH=${PATH}"
            echo "USE_MACA=ON"
            echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
            echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
            echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
            echo "PIP_CACHE_DIR=${PIP_CACHE_DIR}"
            echo "WHEEL_DIR=${WHEEL_DIR}"
          } >> "$GITHUB_ENV"

          echo "Configured compile caches:"
          echo "  TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}"
          echo "  TILELANG_TMP_DIR=${TILELANG_TMP_DIR}"
          echo "  TRITON_CACHE_DIR=${TRITON_CACHE_DIR}"
          echo "  PIP_CACHE_DIR=${PIP_CACHE_DIR}"
          echo "  WHEEL_DIR=${WHEEL_DIR}"
        shell: bash

      - name: Resolve persistent venv
        run: |
          set -euo pipefail

          VENV_PREFIX="tileops_op_test_venv"
          DEP_HASH="$(python3 scripts/dep_hash.py)"
          HASH_INPUT="$(
            {
              echo "python=3.12"
              echo "install=PIP_NO_BUILD_ISOLATION=1 pip install -e '.[dev]'"
              echo "${DEP_HASH}"
            } | sha256sum | cut -c1-16
          )"
          VENV_DIR="${VENV_PREFIX}_${HASH_INPUT}"
          VENV_PATH="${{ runner.tool_cache }}/${VENV_DIR}"

          echo "Resolved venv path: ${VENV_PATH}"
          echo "VENV_DIR=${VENV_DIR}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"

          if [ -x "${VENV_PATH}/bin/python" ]; then
            echo "Reusing existing venv: ${VENV_PATH}"
            echo "VENV_REUSED=true" >> "$GITHUB_ENV"
          else
            echo "No matching venv found. Will create: ${VENV_PATH}"
            echo "VENV_REUSED=false" >> "$GITHUB_ENV"

            for old_venv in "${{ runner.tool_cache }}/${VENV_PREFIX}"_*; do
              if [ ! -d "${old_venv}" ]; then
                continue
              fi
              if [ "${old_venv}" = "${VENV_PATH}" ]; then
                continue
              fi
              echo "Removing stale venv: ${old_venv}"
              rm -rf "${old_venv}"
            done
          fi
        shell: bash

      - name: Ensure persistent venv and install dependencies
        run: |
          set -euo pipefail
          if [ "${VENV_REUSED}" = "true" ]; then
            echo "Using cached venv at ${VENV_PATH}"
            exit 0
          fi

          echo "Creating fresh venv at ${VENV_PATH}"
          python -m venv "${VENV_PATH}"
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          # Copy pre-installed MACA torch packages from conda to venv
          cp -rf /opt/conda/lib/python3.12/site-packages/* "${VENV_PATH}/lib/python3.12/site-packages/"

          python -m pip install --upgrade pip setuptools wheel --no-user

          # Install test dependencies
          pip install --no-cache-dir \
            einops numpy "tqdm>=4.62.3" "typing_extensions>=4.10.0" \
            cloudpickle ml_dtypes psutil Cython \
            setuptools wheel ninja
          pip install --no-cache-dir \
            "pytest==9.0.2" \
            "pytest-xdist>=3.0" \
            "pyyaml>=6.0"

          FIND_LINKS_FLAG=""
          if [[ -d "${WHEEL_DIR}" ]] && ls "${WHEEL_DIR}"/*.whl >/dev/null 2>&1; then
            FIND_LINKS_FLAG="--find-links ${WHEEL_DIR}"
          fi
          # shellcheck disable=SC2086
          PIP_NO_BUILD_ISOLATION=1 PIP_CACHE_DIR="${PIP_CACHE_DIR}" pip install -e '.[dev]' ${FIND_LINKS_FLAG}

          # Install TileLang (MACA version)
          pip install --no-cache-dir git+https://github.com/tile-ai/tilelang-metax.git@1efc3ba8a7c48bc97047e562223538d2dcb2222d

          pip wheel -e '.[dev]' -w "${WHEEL_DIR}" 2>/dev/null || true
      - name: Verify nightly runner environment
        run: scripts/ci/verify_nightly_runner.sh
        shell: bash

      - name: Set up run-local venv
        run: scripts/ci/setup_nightly_venv.sh
        shell: bash

      - name: Run full op tests
        id: op_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          PIP_NO_BUILD_ISOLATION=1 pip install -e ".[dev]"

          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:$PYTHONPATH}"
          echo "Runtime cache env:"
          echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR:-}"
          echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR:-}"
          echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR:-}"

          set -o pipefail
          python -m pytest tests/ -v --tb=short --junit-xml=test_results.xml | tee tileops_op_test.log
        shell: bash

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        if: ${{ always() }}
        with:
          name: tileops_benchmark_${{ github.run_id }}
        continue-on-error: true

      - name: Resolve previous perf history artifact
        id: perf_history_source
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = "nightly.yml";
            const currentRunId = context.runId;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowId,
                branch: "main",
                status: "completed",
                per_page: 100,
              },
            );

            for (const run of runs) {
              if (run.id === currentRunId || run.conclusion !== "success") {
                continue;
              }

              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );

              const artifact = artifacts.find(
                (candidate) =>
                  !candidate.expired && candidate.name === "tileops_perf_history",
              );
              if (!artifact) {
                continue;
              }

              core.info(
                `Using perf history artifact from run ${run.id} (${run.html_url})`,
              );
              core.setOutput("run_id", String(run.id));
              return;
            }

            core.info("No previous perf history artifact found; nightly report will start a new history baseline.");

      - name: Download previous perf history
        uses: actions/download-artifact@v4
        if: ${{ always() && steps.perf_history_source.outputs.run_id != '' }}
        with:
          name: tileops_perf_history
          path: .perf_history
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.perf_history_source.outputs.run_id }}

      - name: Generate nightly report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          pip install --no-deps -e . 2>/dev/null
          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:$PYTHONPATH}"

          HISTORY_ARGS=()
          if [ -f .perf_history/perf_history.json ]; then
            HISTORY_ARGS=(--history .perf_history/perf_history.json)
          fi

          python scripts/nightly_report.py \
            --test-xml test_results.xml \
            --bench-xml bench_results.xml \
            "${HISTORY_ARGS[@]}" \
            --output nightly_report.md \
            --history-out perf_history.json \
            || echo "::warning::nightly_report.py failed"
        shell: bash

      - name: Post nightly report to step summary
        if: ${{ always() && hashFiles('nightly_report.md') != '' }}
        run: cat nightly_report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload op test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tileops_op_test_${{ github.run_id }}
          path: |
            test_results.xml
            tileops_op_test.log
            nightly_report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload perf history
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('perf_history.json') != '' }}
        with:
          name: tileops_perf_history
          path: perf_history.json
          overwrite: true
          retention-days: 14

      - name: Fail op test job if pytest failed
        if: ${{ always() && steps.op_tests.outcome == 'failure' }}
        run: exit 1
        shell: bash

      - name: Cleanup run-local venv
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_ROOT:-}" && "${RUNTIME_ROOT}" == "${RUNNER_TEMP}/nightly-"* ]]; then
            rm -rf "${RUNTIME_ROOT}"
          fi
        shell: bash

  # =========================================================================
  # Phase 4 — Packaging and smoke test
  # =========================================================================
  packaging:
    if: ${{ always() && github.repository == 'MetaX-MACA/TileOPs-Metax' && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') }}
    needs: [op_test]
    permissions:
      contents: write
    runs-on: [tileops-metax-runner, self-hosted, tile-ops, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify nightly runner environment
        run: scripts/ci/verify_nightly_runner.sh
        shell: bash

      - name: Set up run-local venv
        run: scripts/ci/setup_nightly_venv.sh
        shell: bash

      - name: Build and test wheel package
        run: |
          set -euo pipefail
          exec > >(tee packaging.log) 2>&1
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          # Validate GPU frequency
          TARGET_CLOCK_MHZ=1830
          RETRIES=5
          for i in $(seq 1 "${RETRIES}"); do
            gpu_clock=$(mx-smi --query-gpu=clocks.current.graphics --format=csv,noheader,nounits | xargs)
            echo "GPU clock: ${gpu_clock} MHz (attempt ${i}/${RETRIES})"
            if [ "${gpu_clock}" = "${TARGET_CLOCK_MHZ}" ]; then break; fi
            if [ "${i}" -eq "${RETRIES}" ]; then
              echo "::error::GPU frequency validation failed. Expected ${TARGET_CLOCK_MHZ} MHz."
              exit 1
            fi
            sleep 2
          done

          pip install build pytest

          echo "=== Build wheel package ==="
          python -m build --wheel
          echo "=== Build artifacts ==="
          ls -lh dist/*.whl

          echo "=== Install built wheel ==="
          pip install dist/*.whl

          TMP_TEST_DIR="$(mktemp -d "${RUNTIME_ROOT}/packaging-test.XXXXXX")"
          cp -r tests "${TMP_TEST_DIR}/tests"
          cp pyproject.toml "${TMP_TEST_DIR}/"
          cd "${TMP_TEST_DIR}"

          echo "=== Runtime cache env ==="
          echo "TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR:-}"
          echo "TILELANG_TMP_DIR=${TILELANG_TMP_DIR:-}"
          echo "TRITON_CACHE_DIR=${TRITON_CACHE_DIR:-}"

          echo "=== Run pytest packaging ==="
          python -m pytest -q tests/ops -m "packaging" \
            --junit-xml="${GITHUB_WORKSPACE}/packaging_smoke.xml"
        shell: bash

      - name: Upload wheel artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: tileops-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs-${{ github.sha }}
          path: |
            packaging.log
            packaging_smoke.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish wheel to GitHub Release (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

      - name: Cleanup run-local venv
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_ROOT:-}" && "${RUNTIME_ROOT}" == "${RUNNER_TEMP}/nightly-"* ]]; then
            rm -rf "${RUNTIME_ROOT}"
          fi
        shell: bash
