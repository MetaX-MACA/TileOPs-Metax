name: MACA HGEMM Performance

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      shape_set:
        description: HGEMM shape set to run
        required: true
        default: all
        type: choice
        options:
          - long-k
          - table
          - all
      warmup:
        description: Untimed warmup iterations per shape
        required: true
        default: "10"
      rep:
        description: Timed iterations per shape
        required: true
        default: "50"

concurrency:
  group: maca-hgemm-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  TILELANG_CACHE_DIR: /data/cache/tilelang
  TILELANG_TMP_DIR: /data/cache/tilelang/tmp
  TRITON_CACHE_DIR: /data/cache/triton
  PIP_CACHE_DIR: /data/cache/pip
  WHEEL_DIR: /data/cache/wheels
  MAX_JOBS: "64"

jobs:
  maca-hgemm-performance:
    if: ${{ github.repository == 'MetaX-MACA/TileOPs-Metax' }}
    timeout-minutes: 180
    runs-on: tileops-metax-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify nightly runner environment
        run: scripts/ci/verify_nightly_runner.sh
        shell: bash

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git
        shell: bash

      - name: Resolve runtime state
        run: |
          set -euo pipefail

          export PATH="/opt/conda/bin:${PATH}"
          export USE_MACA=ON

          PYPROJECT_HASH=$(python scripts/ci_venv_hash.py pyproject.toml)
          HASH_INPUT="$(
            {
              echo "python=3.12"
              echo "tilelang=f7451dfce010234f540472d442b3f68d4f94232e"
              echo "install=PIP_NO_BUILD_ISOLATION=1 pip install -e '.[dev]'"
              echo "pyproject=${PYPROJECT_HASH}"
            } | sha256sum | cut -c1-16
          )"
          VENV_PREFIX="tileops_hgemm_perf_venv"
          VENV_DIR="${VENV_PREFIX}_${HASH_INPUT}"
          VENV_PATH="/data/cache/venv/${VENV_DIR}"

          mkdir -p "${TILELANG_CACHE_DIR}" "${TILELANG_TMP_DIR}" "${TRITON_CACHE_DIR}" "${PIP_CACHE_DIR}" "${WHEEL_DIR}"

          VENV_REUSED="false"
          if [[ -x "${VENV_PATH}/bin/python" ]]; then
            VENV_REUSED="true"
          fi

          {
            echo "PATH=${PATH}"
            echo "USE_MACA=ON"
            echo "VENV_PATH=${VENV_PATH}"
            echo "VENV_REUSED=${VENV_REUSED}"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Ensure venv and install dependencies
        run: |
          set -euo pipefail

          if [[ "$VENV_REUSED" == "true" ]]; then
            echo "Using cached venv at ${VENV_PATH}"
            exit 0
          fi

          echo "Creating fresh venv at ${VENV_PATH}"
          python -m venv "${VENV_PATH}"
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          cp -rf /opt/conda/lib/python3.12/site-packages/* "${VENV_PATH}/lib/python3.12/site-packages/"

          python -m pip install --upgrade pip setuptools wheel --no-user
          pip install --no-cache-dir git+https://github.com/tile-ai/tilelang-metax.git@f7451dfce010234f540472d442b3f68d4f94232e
          PIP_NO_BUILD_ISOLATION=1 PIP_NO_CACHE_DIR=1 pip install --no-deps -e '.[dev]'
        shell: bash

      - name: Run MACA HGEMM performance driver
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "${VENV_PATH}/bin/activate"

          PIP_NO_BUILD_ISOLATION=1 pip install --no-deps -e ".[dev]"
          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:$PYTHONPATH}"

          TILELANG_DISABLE_CACHE=1 python scripts/bench_maca_hgemm.py \
            --shape-set "${{ inputs.shape_set }}" \
            --backend both \
            --warmup "${{ inputs.warmup }}" \
            --rep "${{ inputs.rep }}" \
            --output-json maca_hgemm_perf.json \
            --output-md maca_hgemm_perf.md \
            | tee maca_hgemm_perf.log
        shell: bash

      - name: Upload MACA HGEMM artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: maca_hgemm_perf_${{ github.run_id }}
          path: |
            maca_hgemm_perf.log
            maca_hgemm_perf.json
            maca_hgemm_perf.md
          if-no-files-found: warn
          retention-days: 14
