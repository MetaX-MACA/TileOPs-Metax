name: Install TileOPs
description: Install TileOPs and TileLang (MACA version) in editable mode

inputs:
  venv-path:
    description: Path to virtual environment
    required: false
    default: .venv
  tilelang-repo:
    description: TileLang repository URL
    required: false
    default: https://github.com/tile-ai/tilelang-metax.git
  tilelang-branch:
    description: TileLang branch to checkout
    required: false
    default: dev

runs:
  using: composite
  steps:
    - name: Install TileOPs
      shell: bash
      run: |
        set -euo pipefail
        source ${{ inputs.venv-path }}/bin/activate
        pip install --no-build-isolation -e ".[dev]"

    - name: Install TileLang (MACA version)
      shell: bash
      run: |
        set -euo pipefail
        source ${{ inputs.venv-path }}/bin/activate

        git clone ${{ inputs.tilelang-repo }} tilelang-metax
        cd tilelang-metax
        git checkout ${{ inputs.tilelang-branch }}
        pip install --no-cache-dir -e .
